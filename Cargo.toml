[package]
name = "zstd-finder"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Seekable, indexed Zstandard archives designed for read-only Finder access"
license = "MIT"
repository = "https://github.com/SorbetUP/ZSTD-Finder"

[lib]
name = "zstd_finder"
path = "src/lib.rs"

[[bin]]
name = "zstd-finder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
